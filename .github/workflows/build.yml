name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download offline voice model
        run: |
          curl -L --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-en-us/uuid

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          gh release create "build-${{ github.run_number }}" Jarvis.apk \
            --title "Jarvis build ${{ github.run_number }}" \
            --notes "Download Jarvis.apk and install it on your phone."
